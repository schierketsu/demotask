<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Деградации</title>
    <link rel="icon" type="image/png" href="icons/for_browser.png">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="js/app.js"></script> 
    <!-- app.js как гланвый скрипт, поэтому он выполняется первым, а в нём уже подключаются другие скрипты -->
</head>
<body>
<div class="filters">
    <!-- период: сначала способ выбора, рядом — поле этого способа (остальные два скрыты, переключает app.js) -->
    <label>Период
        <select id="period-type">
            <option value="month">Месяц</option>
            <option value="year">Год</option>
            <option value="range">Диапазон дат</option>
        </select>
    </label>
    <label id="month-field">Месяц
        <select id="month-filter">
            <!-- месяцы с сервера, app.js -->
        </select>
    </label>
    <label id="year-field" hidden>Год
        <select id="year-filter">
            <!-- годы с сервера, app.js -->
        </select>
    </label>
    <div class="range-field" id="range-field" hidden>
        <label>с <input type="date" id="range-from"></label>
        <label>по <input type="date" id="range-to"></label>
    </div>
    <label>Продукт
        <select id="product-filter">
            <option value="">Все</option> 
            <!-- app.js 88 -->
        </select>
    </label>
</div>

<p class="error" id="error" role="alert" hidden></p>

<main>
    <!-- по строке на метрику: кольцо с полосами сервисов и таблица -->
    <div class="metric-rows" id="metric-rows"></div>
</main>

<div class="tooltip" id="tooltip" role="tooltip" hidden></div>

<!-- окно «Степени деградации сервиса»: содержимое собирает service-dialog.js -->
<dialog class="dialog" id="service-dialog" aria-labelledby="service-dialog-title"></dialog>
</body>
</html>
