<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Деградации</title>
    <link rel="icon" type="image/png" href="icons/for_browser.png">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="js/app.js"></script> 
    <!-- app.js как гланвый скрипт, поэтому он выполняется первым, а в нём уже подключаются другие скрипты -->
</head>
<body>
<div class="filters">
    <label>Месяц
        <select id="month-filter">
            <!-- месяцы с сервера, app.js -->
        </select>
    </label>
    <label>Продукт
        <select id="product-filter">
            <option value="">Все</option> 
            <!-- app.js 88 -->
        </select>
    </label>
</div>

<p class="error" id="error" role="alert" hidden></p>

<main>
    <section class="card">
        <div class="card-head">
            <h2>Степени деградации</h2>
        </div>
        <div class="range" id="range">
            <div class="range-track" id="range-track"></div>
        </div>
        <div class="range-scale" id="range-scale"></div>
    </section>

    <!-- по строке на метрику: кольцо с полосами сервисов и таблица -->
    <div class="metric-rows" id="metric-rows"></div>
</main>

<div class="tooltip" id="tooltip" role="tooltip" hidden></div>
</body>
</html>
