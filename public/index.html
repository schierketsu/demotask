<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Аварии ИС</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="app.js"></script>
</head>
<body>
<header>
    <h1>Аварии ИС и степень деградации</h1>
</header>

<div class="filters">
    <label>Категория операций
        <select id="opcat">
            <option value="">Все</option>
        </select>
    </label>
    <div class="chips" id="chips" role="radiogroup" aria-label="Категория аварии"></div>
</div>

<p class="error" id="error" role="alert" hidden></p>

<main>
    <section class="card">
        <div class="card-head">
            <h2>Категории аварий</h2>
            <button type="button" id="reset">Сбросить</button>
        </div>
        <p class="muted">Двигайте границы или вводите числа, нажмите на цвет, чтобы его сменить — диаграммы и таблица перекрасятся сразу</p>
        <div class="range" id="range">
            <div class="range-track" id="range-track"></div>
        </div>
        <div class="range-scale" id="range-scale"></div>
        <div class="sev-tiles" id="sev-tiles"></div>
    </section>

    <div class="pies" id="pies"></div>

    <section class="card">
        <h2>Таблица</h2>
        <p class="muted">Количество аварий по сервисам и диапазонам деградации, цвет — категория аварии</p>
        <div class="table-wrap" id="table"></div>
    </section>
</main>

<div class="tooltip" id="tooltip" role="tooltip" hidden></div>
</body>
</html>
