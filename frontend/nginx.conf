server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;   # собранный React (папка dist, см. Dockerfile)
    charset utf-8;

    gzip on;
    gzip_types application/json application/javascript text/css;

    location / {
        add_header Cache-Control "no-cache";
    }

    # в стандартном mime.types нет .otf
    location /fonts/ {
        types { font/otf otf; }
        expires 1d;
    }

    # Все запросы /api/* — в Python (FastAPI в сервисе backend); адрес уходит как есть, вместе с /api/.
    # Заголовок Authorization с токеном nginx передаёт как есть
    location /api/ {
        proxy_pass http://backend:8000;
    }

    # Keycloak (вход, токены, админка /auth/admin/) — на том же адресе, что и страница: без CORS
    # и без сторонних cookie. Публичный адрес Keycloak знает сам (KC_HOSTNAME в compose.yaml)
    location /auth/ {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        # у Keycloak большие заголовки ответа (cookie сессии) — стандартного буфера nginx не хватает
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
