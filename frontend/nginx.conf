server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;   # собранный React (папка dist, см. Dockerfile)
    charset utf-8;

    gzip on;
    gzip_types application/json application/javascript text/css;

    location / {
        add_header Cache-Control "no-cache";
    }

    # в стандартном mime.types нет .otf
    location /fonts/ {
        types { font/otf otf; }
        expires 1d;
    }

    # Все запросы /api/* — в Python (FastAPI в сервисе backend); адрес уходит как есть, вместе с /api/
    location /api/ {
        proxy_pass http://backend:8000;
    }
}
