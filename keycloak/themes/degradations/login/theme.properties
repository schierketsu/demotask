# Тема страницы входа Keycloak в стиле дашборда. Подключена в realm (loginTheme в realm-degradations.json),
# папка keycloak/themes смонтирована в контейнер (compose.yaml). В режиме start-dev Keycloak не кэширует темы:
# правки CSS видны сразу после обновления страницы.
#
# Разметка и логика (ошибки, показ пароля, другие шаги входа) — от классической темы keycloak; её стили PatternFly
# не подключаем (stylesCommon пустой) — всё оформление в resources/css/degradations.css.
parent=keycloak
import=common/keycloak

stylesCommon=
styles=css/degradations.css
# светлая или тёмная тема — та же, что на дашборде, и переключатель слева вверху
scripts=js/theme.js

# иконка вкладки — значок дашборда в синих тонах (вместо иконки Keycloak)
favIcon=img/favicon.svg
favIconType=image/svg+xml

# «начать вход заново» — текстом, без иконки
kcResetFlowIcon=
