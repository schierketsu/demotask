server {
    listen 80;
    server_name _;

    root /var/www/public;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types application/json application/javascript text/css;

    # Статика фронтенда
    location / {
        try_files $uri $uri/ =404;
    }

    # Шрифты: в стандартном mime.types нет .otf
    location /assets/fonts/ {
        types { font/otf otf; }
        expires 30d;
    }

    # Все запросы /api/* обрабатывает единая точка входа PHP (код лежит вне public)
    location /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/src/api.php;
        fastcgi_pass php:9000;
    }
}
