services:
  db:
    build: ./docker/db   # postgres:18 с русской локалью
    restart: always
    shm_size: 128mb #размер общей памяти контейнера
    environment:
      POSTGRES_USER: postgres_admin
      POSTGRES_PASSWORD: example
      POSTGRES_DB: testdb
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=ru-RU"
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      # схема и демо-данные загружаются автоматически при первом старте с пустым томом
      - ./db:/docker-entrypoint-initdb.d:ro
      #ro - read-only, чтобы случайно не удалить init-скрипты из контейнера
    healthcheck:
      # -h 127.0.0.1: пока выполняются init-скрипты, postgres слушает только сокет, поэтому «готов» = данные загружены
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres_admin -d testdb"]
      interval: 5s
      timeout: 3s
      retries: 20

  adminer:
    image: adminer
    restart: always
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_HOST_PORT:-8080}:8080"

  # API на Python (FastAPI + uvicorn): backend/app. Код попадает в образ при сборке —
  # после правок: docker compose up -d --build backend
  backend:
    build: ./backend
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: testdb
      DB_USER: postgres_admin
      DB_PASSWORD: example
    depends_on:
      db:
        condition: service_healthy

  # страница на React: Node собирает её из frontend/src, nginx раздаёт сборку и передаёт /api/* в backend.
  # После правок: docker compose up -d --build frontend
  frontend:
    build: ./frontend
    restart: always
    ports:
      - "${WEB_HOST_PORT:-8000}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
